  <!-- LEFT: walk-forward folds -->
  <text x="42" y="100" fill="#58a6ff" font-size="13" font-weight="700" letter-spacing="1.2">ANCHORED WALK-FORWARD SPLITS</text>

  <g>
    <rect x="42" y="118" width="180" height="16" rx="4" fill="#1f6feb" opacity=".85"/>
    <rect x="226" y="118" width="60" height="16" rx="4" fill="#3fb950" opacity=".9"/>
    <rect x="290" y="118" width="200" height="16" rx="4" fill="#21262d"/>

    <rect x="42" y="144" width="244" height="16" rx="4" fill="#1f6feb" opacity=".85"/>
    <rect x="290" y="144" width="60" height="16" rx="4" fill="#3fb950" opacity=".9"/>
    <rect x="354" y="144" width="136" height="16" rx="4" fill="#21262d"/>

    <rect x="42" y="170" width="308" height="16" rx="4" fill="#1f6feb" opacity=".85"/>
    <rect x="354" y="170" width="60" height="16" rx="4" fill="#3fb950" opacity=".9"/>
    <rect x="418" y="170" width="72" height="16" rx="4" fill="#21262d"/>

    <rect x="42" y="196" width="372" height="16" rx="4" fill="#1f6feb" opacity=".85"/>
