  <rect x="530" y="112" width="428" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="552" y="138" fill="#8b949e" font-size="12" font-weight="600" letter-spacing="1">ML SIGNAL vs RULE-BASED BASELINE</text>
  <path d="M552 240 L600 226 L648 236 L696 214 L744 224 L792 204 L840 214 L888 198 L936 196" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M552 242 L600 232 L648 222 L696 228 L744 210 L792 218 L840 200 L888 208 L936 194" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
  <rect x="552" y="248" width="384" height="1" fill="#30363d"/>

