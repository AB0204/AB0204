  <!-- stack chips -->
  <g font-size="13" font-weight="600">
    <rect x="42" y="504" width="78" height="28" rx="14" fill="#1f2937" stroke="#30363d"/>
    <text x="81" y="523" fill="#8b949e" text-anchor="middle">PyTorch</text>
    <rect x="130" y="504" width="82" height="28" rx="14" fill="#1f2937" stroke="#30363d"/>
    <text x="171" y="523" fill="#8b949e" text-anchor="middle">XGBoost</text>
    <rect x="222" y="504" width="84" height="28" rx="14" fill="#1f2937" stroke="#30363d"/>
    <text x="264" y="523" fill="#8b949e" text-anchor="middle">Streamlit</text>
    <rect x="316" y="504" width="98" height="28" rx="14" fill="#1f2937" stroke="#30363d"/>
    <text x="365" y="523" fill="#8b949e" text-anchor="middle">Monte Carlo</text>
