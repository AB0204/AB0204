    <rect x="329" y="336" width="9" height="30" rx="2" fill="#58a6ff" opacity=".45"/>
    <text x="301" y="404" fill="#e6edf3" font-size="17" font-weight="600">Technical</text>
    <text x="301" y="428" fill="#8b949e" font-size="13">12+ engineered indicators</text>
  </g>

  <g>
    <rect x="512" y="320" width="212" height="140" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="512" y="320" width="212" height="3" rx="1.5" fill="#d29922"/>
    <circle cx="542" cy="352" r="6" fill="#d29922" opacity=".85"/>
    <circle cx="566" cy="340" r="6" fill="#d29922" opacity=".55"/>
    <circle cx="566" cy="364" r="6" fill="#d29922" opacity=".55"/>
    <path d="M548 352 L560 342 M548 352 L560 362" stroke="#d29922" stroke-width="1.5"/>
    <text x="536" y="404" fill="#e6edf3" font-size="17" font-weight="600">XGBoost + LSTM</text>
    <text x="536" y="428" fill="#8b949e" font-size="13">next-day direction</text>
